id: land-administration
version: 1.1.0
description: "Evidence-bounded land, lease, ownership, and production-interest operations."

# This catalog is intentionally declarative. It is suitable for review by a
# product owner and can later become a Microsoft Foundry/Azure DevOps manifest.
agents:
  - id: land-case-intake
    file: agents/land-case-intake.agent.md
    purpose: "Assess submitted clues and identify evidence gaps without inventing identifiers."
  - id: land-well-reconciler
    file: agents/land-well-reconciler.agent.md
    purpose: "Compare independent normalized well and production evidence with submitted clues."
  - id: case-synthesizer
    file: agents/case-synthesizer.agent.md
    purpose: "Synthesize structured findings and propose one human route without taking action."

skills:
  - id: lease-obligation-analysis
    file: skills/lease-obligation-analysis/SKILL.md
  - id: lease-lifecycle-review
    file: skills/lease-lifecycle-review/SKILL.md
  - id: ownership-verification
    file: skills/ownership-verification/SKILL.md
  - id: assignment-transfer-review
    file: skills/assignment-transfer-review/SKILL.md

flows:
  - id: wv-land-well-reconciliation
    file: flows/wv-land-well-reconciliation.flow.md
    purpose: "Reconcile submitted well clues with independent public evidence and route uncertainty."

human_control:
  required_before:
    - "legal interpretation or title certification"
    - "payment setup or change"
    - "filing, registry update, or owner communication"
    - "marking an obligation satisfied, waived, or in default"
